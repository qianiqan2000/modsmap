services:
  modsmap:
    build: .
    container_name: modsmap-app
    ports:
      - "80:3000"
    restart: always
    volumes:
      # 把容器里的下载目录挂载到 VPS 本地的 ./data/downloads 文件夹
      - ./data/downloads:/app/public/downloads
    environment:
      - PORT=3000
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
